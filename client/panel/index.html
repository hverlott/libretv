<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>LibreTV 客户端</title>
<style>
  :root {
    --bg: #0b101a;
    --surface: #131a29;
    --surface-2: #1a2333;
    --line: #26314a;
    --text: #e8ecf4;
    --muted: #9aa6bd;
    --faint: #6b7793;
    --accent: #4f8cff;
    --accent-hover: #6b9fff;
    --on-accent: #06101f;
    --green: #35c26b;
    --red: #ef5b5b;
    --warn: #f0a742;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-2: #eef1f7;
      --line: #dde3ee;
      --text: #17203a;
      --muted: #55617a;
      --faint: #8792a8;
      --on-accent: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .app { display: flex; flex-direction: column; height: 100vh; }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  header .logo {
    width: 32px; height: 32px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    display: grid; place-items: center;
    font-weight: 700; font-size: 16px; color: #fff;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header .sub { color: var(--faint); font-size: 12px; }
  header .spacer { flex: 1; }

  main { flex: 1; overflow-y: auto; padding: 24px; max-width: 900px; width: 100%; margin: 0 auto; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px 22px;
  }
  .status-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.on { background: var(--green); box-shadow: 0 0 0 4px rgba(53,194,107,.16); }
  .dot.busy { background: var(--warn); box-shadow: 0 0 0 4px rgba(240,167,66,.16); animation: pulse 1.1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  .status-title { font-size: 17px; font-weight: 600; }
  .status-note { color: var(--faint); font-size: 12px; margin-left: auto; }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px 20px;
  }
  .field .k { color: var(--faint); font-size: 11px; }
  .field .v { font-size: 14px; word-break: break-all; }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  button {
    font: inherit; cursor: pointer;
    border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 18px;
    background: var(--surface-2); color: var(--text);
    transition: background .15s, border-color .15s, opacity .15s;
  }
  button:hover:not(:disabled) { background: var(--line); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button.danger:hover:not(:disabled) { border-color: var(--red); color: var(--red); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .toast {
    margin-top: 16px; padding: 11px 15px; border-radius: 10px;
    font-size: 13px; display: none; word-break: break-word;
  }
  .toast.show { display: block; }
  .toast.ok { background: rgba(53,194,107,.12); border: 1px solid rgba(53,194,107,.35); color: var(--green); }
  .toast.err { background: rgba(239,91,91,.12); border: 1px solid rgba(239,91,91,.35); color: var(--red); }
  .toast.info { background: rgba(79,140,255,.12); border: 1px solid rgba(79,140,255,.35); color: var(--accent); }

  .launch {
    margin-top: 18px; display: flex; align-items: center; gap: 16px;
    padding: 18px 22px; border-radius: 14px;
    background: linear-gradient(120deg, rgba(79,140,255,.16), rgba(139,92,246,.13));
    border: 1px solid rgba(79,140,255,.34);
  }
  .launch .txt { flex: 1; min-width: 0; }
  .launch .txt b { display: block; font-size: 15px; margin-bottom: 2px; }
  .launch .txt span { color: var(--muted); font-size: 12.5px; }

  .log-head {
    display: flex; align-items: center; gap: 12px;
    margin: 22px 0 10px; color: var(--faint); font-size: 12px;
  }
  .log-head button { padding: 4px 11px; font-size: 12px; }
  pre.log {
    margin: 0; padding: 13px 15px; max-height: 210px; overflow: auto;
    background: var(--bg); border: 1px solid var(--line); border-radius: 11px;
    font: 12px/1.55 Consolas, "Cascadia Mono", monospace;
    color: var(--muted); white-space: pre-wrap; word-break: break-all;
  }

  .foot {
    padding: 13px 24px; border-top: 1px solid var(--line);
    color: var(--faint); font-size: 11px;
    display: flex; gap: 16px; flex-wrap: wrap;
  }
  .foot span { white-space: nowrap; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">L</div>
    <div>
      <h1>LibreTV 客户端</h1>
      <div class="sub" id="hdrSub">正在检测服务状态…</div>
    </div>
    <div class="spacer"></div>
  </header>

  <main>
    <section class="card">
      <div class="status-head">
        <span class="dot" id="dot"></span>
        <span class="status-title" id="statusTitle">检测中…</span>
        <span class="status-note" id="statusNote"></span>
      </div>

      <div class="grid">
        <div class="field"><div class="k">访问地址</div><div class="v" id="fUrl">—</div></div>
        <div class="field"><div class="k">端口</div><div class="v" id="fPort">—</div></div>
        <div class="field"><div class="k">进程 PID</div><div class="v" id="fPid">—</div></div>
        <div class="field"><div class="k">已运行</div><div class="v" id="fUptime">—</div></div>
        <div class="field"><div class="k">识别方式</div><div class="v" id="fDetected">—</div></div>
      </div>

      <div class="actions">
        <button class="primary" id="btnStart">开启服务</button>
        <button class="danger" id="btnStop">关闭服务</button>
        <button id="btnRestart">重启服务</button>
        <button id="btnBrowser">用浏览器打开</button>
      </div>

      <div class="toast" id="toast"></div>
    </section>

    <section class="launch">
      <div class="txt">
        <b>进入系统看电影</b>
        <span id="launchSub">在客户端窗口内打开 LibreTV 播放器</span>
      </div>
      <button class="primary" id="btnEnter">进入系统</button>
    </section>

    <div class="log-head">
      <span>服务日志（.runtime/libretv.log）</span>
      <button id="btnLogs">刷新日志</button>
    </div>
    <pre class="log" id="log">（暂无日志）</pre>
  </main>

  <div class="foot">
    <span id="footVer"></span>
    <span id="footRoot"></span>
  </div>
</div>

<script src="/panel.js"></script>
</body>
</html>
